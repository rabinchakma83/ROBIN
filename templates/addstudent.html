{% extends 'base.html'%}

{% block content %}

<body>
    <h1>Add Student</h1>
    <form action="{% url 'addstudent' %}" method="post">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="roll">Roll:</label>
        <input type="number" id="roll" name="roll" required>
        <br>
        <label for="department">Department:</label>
        <input type="text" id="department" name="department" required>
        <br>
        <label for="semester">Semester:</label>
        <input type="text" id="semester" name="semester">
        <br>
        <label for="cgpa">CGPA:</label>
        <input type="number" step="0.01" id="cgpa" name="cgpa">
        <br>
        <button type="submit">submit</button>
    </form>
    <style>
    table {
        border-collapse: collapse;
        font-size: 18px;
        width: 60%;
    }
    th, td {
        padding: 10px 18px;
        border: 1px solid black;
        text-align: left;
    }
    h1 {
        font-size: 28px;
    }
</style>
    <h1>student table</h1>
    <table border="1">
        <tr>
            <th>name</th>
            <th>roll</th>
            <th>department</th>
            <th>semester</th>
            <th>cgpa</th>
            
        </tr>
        {% for i in students %}
        <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.roll }}</td>
            <td>{{ i.department }}</td>
            <td>{{ i.semester }}</td>
            <td>{{ i.cgpa }}</td>
            
        </tr> 
        {% endfor %}
    </table> 
    {% endblock %}
