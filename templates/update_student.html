{% extends 'base.html' %}

{% block content %}
    <h1>update student</h1>
    <form action="{% url 'updateStudent' %}" method="post">
        {% csrf_token %}
        <label for="id">id:</label>
        <input type="number" id="id" value="{{students.id}}" name="id">
        <br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" value="{{students.name}}" name="name">
        <br><br>
        <label for="roll">Roll:</label>
        <input type="number" id="roll" value="{{students.roll}}" name="roll" required>
        <br><br>
        <label for="department">Department:</label>
        <input type="text" id="department" value="{{students.department}}" name="department" required>
        <br><br>
        <label for="semester">Semester:</label>
        <input type="text" id="semester" value="{{students.semester}}" name="semester">
        <br><br>
        <label for="cgpa">CGPA:</label>
        <input type="number" step="0.01" id="cgpa" value="{{students.cgpa}}" name="cgpa">
        <br><br>
        <button type="submit">submit</button>
        
    </form>
   
{% endblock %}
