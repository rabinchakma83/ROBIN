{% extends 'base.html' %}

{% block content %}

<h1>hello world {{ dict_name }}</h1>
    

    <a href="{% url 'logout' %}">Logout</a><br><br>
    <a href="{% url 'updatepassword' %}">Change Password</a><br><br>
    <div class="container">
    <table class="table table-dark table-striped">
        <tr>
            <th>name</th>
            <th>roll</th>
            <th>department</th>
            <th>semester</th>
            <th>cgpa</th>
            <th>action</th>
        </tr>
        {% for i in students %}
        <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.roll }}</td>
            <td>{{ i.department }}</td>
            <td>{{ i.semester }}</td>
            <td>{{ i.cgpa }}</td>
            <td>
                <a href="{% url 'studentUpdate' i.id %}">edit</a>
                <a href="{% url 'studentDelete' i.id %}">delete</a>
            </td>
        </tr> 
        {% endfor %}
    </table>
    </div>
    {% endblock %}
